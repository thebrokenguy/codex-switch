[package]
name = "codex-switch"
version = "0.1.0"
description = "Alternador de contas do Codex com painel de cotas"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "codex_switch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0.104"
base64 = "0.23.1"
dirs = "7.0.0"
sha2 = "0.11.0"
chrono = { version = "0.4.45", features = ["serde"] }
tokio = { version = "1.53.1", features = ["time"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "gzip", "native-tls", "form"] }
tauri-plugin-single-instance = "2.4.4"
tauri-plugin-dialog = "^2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
