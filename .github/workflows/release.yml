name: release

# Gera a release do app portátil quando uma tag v* é enviada:
# - codex-switch-portable.exe (exe único, roda de qualquer pasta)
# - update-manifest.json (versão + SHA-256 lidos pelo auto-update do app)
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Confere tag x versão do app
        shell: bash
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME não combina com a versão do app ($version)."
            echo "Atualize src-tauri/tauri.conf.json (e package.json/Cargo.toml) antes de taggear."
            exit 1
          fi

      - name: Dependências
        run: npm ci

      - name: Build portátil
        run: npm run tauri build -- --no-bundle

      - name: Prepara exe, hash e manifesto
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp src-tauri/target/release/codex-switch.exe codex-switch-portable.exe
          sha256="$(sha256sum codex-switch-portable.exe | cut -d' ' -f1)"
          printf '{"version":"%s","asset":"codex-switch-portable.exe","sha256":"%s"}' \
            "$version" "$sha256" > update-manifest.json
          cat update-manifest.json

      - name: Publica release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          codex-switch-portable.exe update-manifest.json
          --title "codex-switch $GITHUB_REF_NAME"
          --notes "App portátil: baixe o codex-switch-portable.exe e rode de qualquer pasta. Instalações anteriores atualizam sozinhas."
